<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0f1424"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="2"/>

  <!-- Ambient light -->
  <circle cx="200" cy="100" r="160" fill="#6366f1" opacity="0.12"/>
  <circle cx="600" cy="350" r="160" fill="#a855f7" opacity="0.12"/>

  <!-- Terminal Window Bar -->
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#090d18" stroke="#334155" stroke-width="1.2"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#0f172a"/>
  
  <!-- Buttons -->
  <circle cx="52" cy="46" r="6.5" fill="#ef4444"/>
  <circle cx="74" cy="46" r="6.5" fill="#f59e0b"/>
  <circle cx="96" cy="46" r="6.5" fill="#10b981"/>

  <text x="400" y="51" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" text-anchor="middle">
    student_linked_list.c - Singly Linked List Engine (O(1) Head Insertion)
  </text>
  
  <rect x="660" y="36" width="96" height="20" rx="10" fill="#312e81"/>
  <text x="708" y="50" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">HEAP MALLOC</text>

  <!-- Content: Linked List Nodes Diagram -->
  <g font-family="'JetBrains Mono', monospace">
    <!-- Header code snippet -->
    <text x="50" y="100" fill="#c084fc" font-size="12">typedef struct StudentNode {</text>
    <text x="70" y="118" fill="#94a3b8" font-size="12">char id[15], name[50]; float gpa; <tspan fill="#38bdf8">struct StudentNode* next;</tspan></text>
    <text x="50" y="136" fill="#c084fc" font-size="12">} Node;</text>

    <!-- HEAD pointer -->
    <rect x="50" y="170" width="80" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="90" y="192" fill="#94a3b8" font-size="10" text-anchor="middle">POINTER</text>
    <text x="90" y="210" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">*HEAD</text>

    <!-- Arrow from HEAD to Node 1 -->
    <line x1="130" y1="195" x2="178" y2="195" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,2"/>
    <polygon points="182,195 174,190 174,200" fill="#a855f7"/>

    <!-- Node 1 -->
    <rect x="185" y="156" width="165" height="78" rx="8" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="295" y1="156" x2="295" y2="234" stroke="#818cf8" stroke-width="1"/>
    <text x="240" y="180" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">ID: 231-15-4892</text>
    <text x="240" y="200" fill="#93c5fd" font-size="11" text-anchor="middle">Jakirul Islam</text>
    <text x="240" y="220" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">GPA: 3.90</text>
    <text x="325" y="199" fill="#c084fc" font-size="11" text-anchor="middle">next*</text>

    <!-- Arrow from Node 1 to Node 2 -->
    <line x1="350" y1="195" x2="398" y2="195" stroke="#a855f7" stroke-width="2.5"/>
    <polygon points="402,195 394,190 394,200" fill="#a855f7"/>

    <!-- Node 2 -->
    <rect x="405" y="156" width="165" height="78" rx="8" fill="url(#nodeGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="515" y1="156" x2="515" y2="234" stroke="#a855f7" stroke-width="1"/>
    <text x="460" y="180" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">ID: 231-15-5100</text>
    <text x="460" y="200" fill="#93c5fd" font-size="11" text-anchor="middle">Sadia Rahman</text>
    <text x="460" y="220" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">GPA: 3.85</text>
    <text x="545" y="199" fill="#c084fc" font-size="11" text-anchor="middle">next*</text>

    <!-- Arrow from Node 2 to NULL -->
    <line x1="570" y1="195" x2="628" y2="195" stroke="#a855f7" stroke-width="2.5"/>
    <polygon points="632,195 624,190 624,200" fill="#a855f7"/>

    <!-- NULL Terminator -->
    <rect x="635" y="172" width="75" height="46" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="672" y="200" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle">NULL</text>

    <!-- Console Output Simulation at Bottom -->
    <rect x="50" y="260" width="690" height="140" rx="8" fill="#030712" stroke="#1f2937"/>
    <text x="70" y="288" fill="#34d399" font-size="12">✔ Dynamic memory allocated: sizeof(Node) = 64 bytes via malloc()</text>
    <text x="70" y="310" fill="#38bdf8" font-size="12">➜ Searching Student by ID: "231-15-4892" ... Found in 1 Hop [O(1) best case]</text>
    <text x="70" y="332" fill="#cbd5e1" font-size="12">➜ Records synchronized to binary database: students_database.bin [2,480 Records]</text>
    <text x="70" y="354" fill="#a855f7" font-size="12">➜ Traversal time: 0.00018 ms | Zero memory leaks (valgrind checked: 0 errors)</text>
    <text x="70" y="378" fill="#f59e0b" font-size="12">⚡ Singly Linked List operations: Insert, Delete, Search, QuickSort by GPA</text>
  </g>
</svg>
